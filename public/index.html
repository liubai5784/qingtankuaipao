<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>轻坦快跑</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            touch-action: manipulation;
            overscroll-behavior: none;
            -webkit-overflow-scrolling: auto;
            user-select: none;
            -webkit-user-select: none;
        }

        #rotateHint {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111;
            z-index: 10000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
            padding: 28px;
        }
        #rotateHint .icon { font-size: 64px; animation: spin 2s ease-in-out infinite; }
        #rotateHint .text { font-size: 20px; margin-top: 16px; color: #ccc; line-height: 1.6; }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        #gameContainer {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh; height: 100dvh;
            display: none;
        }
        canvas {
            display: block; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            image-rendering: auto;
        }
        #uiCanvas { z-index: 10; pointer-events: none; }

        .ctrl-btn {
            position: fixed;
            width: 64px; height: 64px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.5);
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            z-index: 9998;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.1s, transform 0.1s, opacity 0.2s;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            background: rgba(255,255,255,0.12);
        }
        .ctrl-btn:active { background: rgba(255,255,255,0.35); transform: scale(0.92); }
        .ctrl-btn.is-low { opacity: 0.45; }

        #jumpBtn  { bottom: 28px; right: 28px; }
        #crouchBtn { bottom: 28px; right: 108px; }
        #skillBtn {
            bottom: 28px; right: 188px;
            border-color: rgba(255,215,0,0.55); color: #FFD700;
            background: rgba(255,215,0,0.1);
            font-size: 12px;
        }
        #skillBtn:active { background: rgba(255,215,0,0.3); }
        #pauseBtn {
            top: 132px; right: 24px;
            width: 52px; height: 52px;
            font-size: 12px;
            border-color: rgba(180,220,255,0.45);
            background: rgba(0,0,0,0.22);
        }
    </style>
</head>
<body>

<div id="rotateHint">
    <div class="icon">📱</div>
    <div class="text">请将设备旋转至横屏模式<br>如果无法旋转，请跳转至浏览器打开</div>
</div>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <canvas id="uiCanvas"></canvas>
</div>
<button class="ctrl-btn" id="pauseBtn">暂停</button>
<button class="ctrl-btn" id="skillBtn">主防</button>
<button class="ctrl-btn" id="crouchBtn">蹲</button>
<button class="ctrl-btn" id="jumpBtn">跳</button>

<script>
(function() {
    'use strict';

    var rotateHint = document.getElementById('rotateHint');
    var gameContainer = document.getElementById('gameContainer');
    var buttons = document.querySelectorAll('.ctrl-btn');

    function checkOrientation() {
        var isLandscape = window.innerWidth > window.innerHeight;
        if (!isLandscape) {
            rotateHint.style.display = 'flex';
            gameContainer.style.display = 'none';
            buttons.forEach(function(b) { b.style.display = 'none'; });
        } else {
            rotateHint.style.display = 'none';
            gameContainer.style.display = 'block';
            buttons.forEach(function(b) { b.style.display = 'flex'; });
        }
    }

    window.addEventListener('resize', checkOrientation);
    window.addEventListener('orientationchange', function() { setTimeout(checkOrientation, 200); });
    window.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    checkOrientation();

    var gameCanvas = document.getElementById('gameCanvas');
    var uiCanvas = document.getElementById('uiCanvas');
    var ctx = gameCanvas.getContext('2d');
    var uiCtx = uiCanvas.getContext('2d');

    var WIDTH = 1920;
    var HEIGHT = 1080;
    gameCanvas.width = WIDTH;
    gameCanvas.height = HEIGHT;
    uiCanvas.width = WIDTH;
    uiCanvas.height = HEIGHT;

    var imageList = [
        { name: 'tank_normal_ready',  ext: 'png' },
        { name: 'tank_normal_active', ext: 'jpg' },
        { name: 'tank_normal_cd',     ext: 'jpg' },
        { name: 'tank_crouch_ready',  ext: 'jpg' },
        { name: 'tank_crouch_active', ext: 'jpg' },
        { name: 'tank_crouch_cd',     ext: 'jpg' },
        { name: 'obstacle_ground',    ext: 'png' },
        { name: 'obstacle_air',       ext: 'jpg' },
        { name: 'weld_torch',         ext: 'png' },
        { name: 'bg',                 ext: 'jpg' },
        { name: 'ground',             ext: 'png' }
    ];

    var images = {};
    var loaded = 0;
    var totalImages = imageList.length;

    for (var i = 0; i < imageList.length; i++) {
        var item = imageList[i];
        var img = new Image();
        images[item.name] = img;
        img.onload = function() { loaded++; };
        img.onerror = function() { loaded++; };
        img.src = './assets/' + item.name + '.' + item.ext;
    }

    var TANK_W = 240;
    var TANK_H = Math.round(TANK_W * (1071 / 2542));
    var TANK_CROUCH_H = Math.round(TANK_W * (539 / 2542));
    var OBS_G_W = 92;
    var OBS_G_H = Math.round(OBS_G_W * (435 / 566));
    var OBS_A_W = 84;
    var OBS_A_H = Math.round(OBS_A_W * (1229 / 1251));
    var PICKUP_W = 80;
    var PICKUP_H = Math.round(PICKUP_W * (351 / 537));
    var GROUND_H = 130;
    var GROUND_Y = HEIGHT - GROUND_H;
    var BEST_KEY = 'qingtankuaipao-best-score-v2';

    function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
    }

    function readBestScore() {
        try { return Number(localStorage.getItem(BEST_KEY) || 0) || 0; }
        catch (error) { return 0; }
    }

    function writeBestScore(value) {
        try { localStorage.setItem(BEST_KEY, String(value)); }
        catch (error) {}
    }

    var tank = {};
    var obstacles = [];
    var pickups = [];
    var floatingTexts = [];
    var obstacleTimer = 0;
    var obstacleInterval = 150;
    var pickupTimer = 0;
    var pickupInterval = 310;
    var frameCount = 0;
    var score = 0;
    var bestScore = readBestScore();
    var combo = 0;
    var maxCombo = 0;
    var gameSpeed = 7.2;
    var gameOver = false;
    var gameStarted = false;
    var paused = false;
    var jumpBuffer = 0;
    var coyoteTimer = 0;
    var spacePressed = false;
    var groundOffset = 0;

    function resetTank() {
        tank = {
            x: 200,
            y: GROUND_Y - TANK_H,
            w: TANK_W,
            h: TANK_H,
            vy: 0,
            jumping: false,
            crouching: false,
            targetY: GROUND_Y - TANK_H,
            hp: 100,
            maxHp: 100,
            skillActive: false,
            skillTimer: 0,
            skillDuration: 10 * 60,
            skillCooldown: 30 * 60,
            skillCooldownTimer: 0,
            invincibleTimer: 0,
            invincibleDuration: 32
        };
    }

    function resetGame() {
        resetTank();
        obstacles = [];
        pickups = [];
        floatingTexts = [];
        obstacleTimer = 0;
        pickupTimer = 0;
        frameCount = 0;
        score = 0;
        combo = 0;
        maxCombo = 0;
        gameSpeed = 7.2;
        gameOver = false;
        gameStarted = false;
        paused = false;
        jumpBuffer = 0;
        coyoteTimer = 0;
        groundOffset = 0;
        updateButtonText();
    }

    resetGame();

    function startGame() {
        if (!gameStarted && !gameOver) gameStarted = true;
    }

    function requestJump() {
        if (!gameStarted) { startGame(); return; }
        if (gameOver) { resetGame(); return; }
        if (paused) return;
        jumpBuffer = 8;
    }

    function doCrouch() {
        if (!gameStarted || gameOver || paused) return;
        if (tank.crouching) return;
        tank.crouching = true;
        if (!tank.jumping) {
            tank.targetY = GROUND_Y - TANK_CROUCH_H;
        } else {
            tank.vy = Math.max(tank.vy, 8);
        }
    }

    function doStand() {
        tank.crouching = false;
        if (!tank.jumping) tank.targetY = GROUND_Y - TANK_H;
    }

    function activateSkill() {
        if (!gameStarted) { startGame(); return; }
        if (gameOver || paused) return;
        if (tank.skillActive || tank.skillCooldownTimer > 0) return;
        tank.skillActive = true;
        tank.skillTimer = tank.skillDuration;
        addFloatingText('主防开启', tank.x + TANK_W / 2, tank.y - 25, '#FFD700');
        updateButtonText();
    }

    function togglePause() {
        if (!gameStarted || gameOver) return;
        paused = !paused;
        updateButtonText();
    }

    function executeJump() {
        tank.crouching = false;
        tank.targetY = GROUND_Y - TANK_H;
        tank.vy = -18.5;
        tank.jumping = true;
        coyoteTimer = 0;
        jumpBuffer = 0;
    }

    function updateButtonText() {
        var pauseBtn = document.getElementById('pauseBtn');
        var skillBtn = document.getElementById('skillBtn');
        pauseBtn.textContent = paused ? '继续' : '暂停';
        if (tank.skillActive) {
            skillBtn.textContent = '防御';
            skillBtn.classList.remove('is-low');
        } else if (tank.skillCooldownTimer > 0) {
            skillBtn.textContent = Math.ceil(tank.skillCooldownTimer / 60) + 's';
            skillBtn.classList.add('is-low');
        } else {
            skillBtn.textContent = '主防';
            skillBtn.classList.remove('is-low');
        }
    }

    document.addEventListener('keydown', function(e) {
        if (e.repeat) return;

        if (e.code === 'KeyP' || e.code === 'Escape') {
            e.preventDefault();
            togglePause();
            return;
        }

        if (!gameStarted && !gameOver) {
            if (['Space', 'ArrowUp', 'KeyW', 'ArrowDown', 'KeyS', 'ShiftLeft', 'ShiftRight'].indexOf(e.code) !== -1) startGame();
        }

        if (gameOver) {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') {
                e.preventDefault();
                resetGame();
            }
            return;
        }

        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
            e.preventDefault();
            if (!spacePressed) {
                spacePressed = true;
                requestJump();
            }
        }
        if (e.code === 'ArrowDown' || e.code === 'KeyS') {
            e.preventDefault();
            doCrouch();
        }
        if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
            e.preventDefault();
            activateSkill();
        }
    });

    document.addEventListener('keyup', function(e) {
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') spacePressed = false;
        if (e.code === 'ArrowDown' || e.code === 'KeyS') doStand();
    });

    document.getElementById('jumpBtn').addEventListener('pointerdown', function(e) {
        e.preventDefault(); e.stopPropagation(); requestJump();
    });

    var crouchBtn = document.getElementById('crouchBtn');
    crouchBtn.addEventListener('pointerdown', function(e) { e.preventDefault(); e.stopPropagation(); doCrouch(); });
    crouchBtn.addEventListener('pointerup', function(e) { e.preventDefault(); doStand(); });
    crouchBtn.addEventListener('pointercancel', doStand);
    crouchBtn.addEventListener('pointerleave', doStand);

    document.getElementById('skillBtn').addEventListener('pointerdown', function(e) {
        e.preventDefault(); e.stopPropagation(); activateSkill();
    });

    document.getElementById('pauseBtn').addEventListener('pointerdown', function(e) {
        e.preventDefault(); e.stopPropagation(); togglePause();
    });

    document.addEventListener('click', function(e) {
        if (e.target.tagName === 'BUTTON') return;
        if (window.innerWidth <= window.innerHeight) return;
        if (!gameStarted && !gameOver) { startGame(); return; }
        if (gameOver) { resetGame(); return; }
        requestJump();
    });

    function rectCollide(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function getTankImage() {
        var c = tank.crouching;
        if (tank.skillActive) return images[c ? 'tank_crouch_active' : 'tank_normal_active'];
        if (tank.skillCooldownTimer > 0) return images[c ? 'tank_crouch_cd' : 'tank_normal_cd'];
        return images[c ? 'tank_crouch_ready' : 'tank_normal_ready'];
    }

    function getTankHeight() {
        return tank.crouching ? TANK_CROUCH_H : TANK_H;
    }

    function addFloatingText(text, x, y, color) {
        floatingTexts.push({ text: text, x: x, y: y, life: 60, color: color || '#fff' });
    }

    function addCombo(amount) {
        combo += amount || 1;
        maxCombo = Math.max(maxCombo, combo);
    }

    function resetCombo() {
        combo = 0;
    }

    function spawnObstacle() {
        var isAir = Math.random() < (score > 260 ? 0.45 : 0.28);
        var airGap = 86 + Math.random() * 36;
        obstacles.push({
            x: WIDTH + 30,
            y: isAir ? GROUND_Y - OBS_A_H - airGap : GROUND_Y - OBS_G_H,
            w: isAir ? OBS_A_W : OBS_G_W,
            h: isAir ? OBS_A_H : OBS_G_H,
            type: isAir ? 'air' : 'ground',
            scored: false,
            blocked: false
        });
    }

    function spawnPickup() {
        var hpRatio = tank.hp / tank.maxHp;
        var spawnChance = hpRatio < 0.45 ? 0.74 : 0.36;
        if (Math.random() > spawnChance) return;
        pickups.push({ x: WIDTH + 30, y: GROUND_Y - PICKUP_H - 18, w: PICKUP_W, h: PICKUP_H });
    }

    function rewardObstaclePass(o) {
        if (o.scored) return;
        o.scored = true;

        var reward = 26;
        var near = false;
        if (o.type === 'ground') {
            var bottomGap = o.y - (tank.y + getTankHeight());
            near = bottomGap >= 0 && bottomGap < 100;
        } else {
            var topGap = tank.y - (o.y + o.h);
            near = topGap >= 0 && topGap < 90;
        }

        if (near) {
            reward = 68 + Math.min(combo * 2, 50);
            addFloatingText('极限闪避 +' + reward, o.x, o.y - 30, '#FFD700');
        } else {
            addFloatingText('通过 +' + reward, o.x, o.y - 20, '#BDEBFF');
        }
        score += reward;
        addCombo(1);
    }

    function blockObstacle(o) {
        if (o.blocked) return;
        o.blocked = true;
        var reward = 50 + Math.min(combo * 2, 50);
        score += reward;
        addCombo(1);
        addFloatingText('主防格挡 +' + reward, o.x, o.y - 30, '#FFD700');
        o.x = -999;
    }

    function takeDamage(o) {
        tank.hp -= 25;
        tank.invincibleTimer = tank.invincibleDuration;
        resetCombo();
        addFloatingText('-25 HP', tank.x + 80, tank.y - 24, '#FF5C5C');
        o.x = -999;
        if (tank.hp <= 0) {
            tank.hp = 0;
            finishGame();
        }
    }

    function finishGame() {
        gameOver = true;
        tank.skillActive = false;
        var finalScore = Math.floor(score);
        if (finalScore > bestScore) {
            bestScore = finalScore;
            writeBestScore(bestScore);
            addFloatingText('新纪录！', WIDTH / 2, HEIGHT / 2 - 170, '#FFD700');
        }
        updateButtonText();
    }

    function update() {
        if (!gameStarted || gameOver || paused) return;

        frameCount++;
        score += 0.72 + gameSpeed * 0.045;
        gameSpeed = Math.min(18, 7.2 + score / 1200 + Math.min(combo, 35) * 0.035);
        obstacleInterval = Math.max(76, 152 - score / 85);
        pickupInterval = Math.max(160, 320 - score / 120);
        groundOffset = (groundOffset + gameSpeed) % WIDTH;

        jumpBuffer = Math.max(0, jumpBuffer - 1);
        tank.vy += 0.72;
        tank.y += tank.vy;

        var targetH = getTankHeight();
        var floorY = GROUND_Y - targetH;
        var onGround = tank.y >= floorY;
        if (onGround) {
            tank.y = floorY;
            tank.vy = 0;
            tank.jumping = false;
            coyoteTimer = 8;
        } else {
            tank.jumping = true;
            coyoteTimer = Math.max(0, coyoteTimer - 1);
        }

        if (jumpBuffer > 0 && coyoteTimer > 0) executeJump();

        if (!tank.jumping) {
            tank.targetY = GROUND_Y - getTankHeight();
            tank.y += (tank.targetY - tank.y) * 0.38;
        }

        if (tank.skillActive) {
            tank.skillTimer--;
            if (tank.skillTimer <= 0) {
                tank.skillActive = false;
                tank.skillCooldownTimer = tank.skillCooldown;
            }
        }
        if (tank.skillCooldownTimer > 0) tank.skillCooldownTimer--;
        if (tank.invincibleTimer > 0) tank.invincibleTimer--;

        obstacleTimer++;
        var minGap = 430 + gameSpeed * 22;
        var lastObs = obstacles.length > 0 ? obstacles[obstacles.length - 1] : null;
        if (frameCount > 70 && obstacleTimer >= obstacleInterval && (!lastObs || WIDTH - lastObs.x >= minGap)) {
            obstacleTimer = 0;
            spawnObstacle();
        }

        pickupTimer++;
        var lastPickup = pickups.length > 0 ? pickups[pickups.length - 1] : null;
        if (frameCount > 160 && pickupTimer >= pickupInterval && (!lastPickup || WIDTH - lastPickup.x >= 420)) {
            pickupTimer = 0;
            spawnPickup();
        }

        for (var i = 0; i < obstacles.length; i++) obstacles[i].x -= gameSpeed;
        for (var j = 0; j < pickups.length; j++) pickups[j].x -= gameSpeed;

        var tankRect = { x: tank.x + 18, y: tank.y + 8, w: TANK_W - 34, h: getTankHeight() - 12 };

        for (var k = 0; k < obstacles.length; k++) {
            var o = obstacles[k];
            if (!o.scored && o.x + o.w < tank.x) rewardObstaclePass(o);
            if (rectCollide(tankRect, o)) {
                if (tank.skillActive) blockObstacle(o);
                else if (tank.invincibleTimer <= 0) takeDamage(o);
            }
        }

        for (var p = 0; p < pickups.length; p++) {
            var item = pickups[p];
            if (rectCollide(tankRect, item)) {
                var oldHp = tank.hp;
                tank.hp = Math.min(tank.maxHp, tank.hp + 25);
                score += 40;
                addCombo(1);
                addFloatingText(oldHp < tank.hp ? '维修 +25' : '状态良好 +40', item.x, item.y - 18, '#7CFF8A');
                item.x = -999;
            }
        }

        obstacles = obstacles.filter(function(o) { return o.x > -180 && o.x !== -999; });
        pickups = pickups.filter(function(p) { return p.x > -120 && p.x !== -999; });

        for (var t = 0; t < floatingTexts.length; t++) {
            floatingTexts[t].y -= 1.3;
            floatingTexts[t].life--;
        }
        floatingTexts = floatingTexts.filter(function(t) { return t.life > 0; });

        var liveScore = Math.floor(score);
        if (liveScore > bestScore) {
            bestScore = liveScore;
            writeBestScore(bestScore);
        }
        updateButtonText();
    }

    function drawBackground() {
        var bg = images.bg;
        if (bg && bg.complete && bg.naturalWidth > 0) {
            ctx.drawImage(bg, 0, 0, WIDTH, HEIGHT);
        } else {
            var grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
            grad.addColorStop(0, '#1a1a2e');
            grad.addColorStop(1, '#0f3460');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, WIDTH, GROUND_Y);
        }

        var g = images.ground;
        if (g && g.complete && g.naturalWidth > 0) {
            ctx.drawImage(g, -groundOffset, GROUND_Y, WIDTH, GROUND_H);
            ctx.drawImage(g, WIDTH - groundOffset, GROUND_Y, WIDTH, GROUND_H);
        } else {
            var grad2 = ctx.createLinearGradient(0, GROUND_Y, 0, HEIGHT);
            grad2.addColorStop(0, '#3d2b1f');
            grad2.addColorStop(1, '#1a0f07');
            ctx.fillStyle = grad2;
            ctx.fillRect(0, GROUND_Y, WIDTH, GROUND_H);
        }

        var fog = ctx.createLinearGradient(0, GROUND_Y - 200, 0, GROUND_Y);
        fog.addColorStop(0, 'rgba(255,255,255,0)');
        fog.addColorStop(1, 'rgba(255,255,255,0.04)');
        ctx.fillStyle = fog;
        ctx.fillRect(0, GROUND_Y - 200, WIDTH, 200);
    }

    function drawTank() {
        var img = getTankImage();
        var h = getTankHeight();
        tank.h = h;

        ctx.save();
        if (tank.invincibleTimer > 0 && Math.floor(tank.invincibleTimer / 4) % 2 === 0) ctx.globalAlpha = 0.48;

        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(tank.x + TANK_W / 2, GROUND_Y - 4, TANK_W / 2.5, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        if (tank.skillActive) {
            ctx.strokeStyle = 'rgba(255,215,0,0.86)';
            ctx.lineWidth = 7;
            ctx.shadowColor = '#FFD700';
            ctx.shadowBlur = 22;
            ctx.beginPath();
            ctx.ellipse(tank.x + TANK_W / 2, tank.y + h / 2, TANK_W * 0.62, h * 0.82 + 34, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        if (img && img.complete && img.naturalWidth > 0) {
            ctx.drawImage(img, tank.x, tank.y, TANK_W, h);
        } else {
            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(tank.x, tank.y, TANK_W, h);
        }
        ctx.restore();
    }

    function drawObstacles() {
        for (var i = 0; i < obstacles.length; i++) {
            var o = obstacles[i];
            var img = images[o.type === 'air' ? 'obstacle_air' : 'obstacle_ground'];
            if (img && img.complete && img.naturalWidth > 0) {
                ctx.drawImage(img, o.x, o.y, o.w, o.h);
            } else {
                ctx.fillStyle = o.type === 'air' ? '#FF4444' : '#333';
                ctx.fillRect(o.x, o.y, o.w, o.h);
            }
        }
    }

    function drawPickups() {
        var img = images.weld_torch;
        for (var i = 0; i < pickups.length; i++) {
            var p = pickups[i];
            ctx.save();
            ctx.shadowColor = '#FFD700';
            ctx.shadowBlur = 15;
            if (img && img.complete && img.naturalWidth > 0) {
                ctx.drawImage(img, p.x, p.y, PICKUP_W, PICKUP_H);
            } else {
                ctx.fillStyle = '#FFD700';
                ctx.fillRect(p.x, p.y, PICKUP_W, PICKUP_H);
            }
            ctx.restore();
        }
    }

    function roundedRect(context, x, y, w, h, r) {
        context.beginPath();
        context.moveTo(x + r, y);
        context.lineTo(x + w - r, y);
        context.quadraticCurveTo(x + w, y, x + w, y + r);
        context.lineTo(x + w, y + h - r);
        context.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        context.lineTo(x + r, y + h);
        context.quadraticCurveTo(x, y + h, x, y + h - r);
        context.lineTo(x, y + r);
        context.quadraticCurveTo(x, y, x + r, y);
        context.closePath();
    }

    function drawBar(x, y, w, h, ratio, color, label) {
        uiCtx.fillStyle = 'rgba(0,0,0,0.5)';
        uiCtx.strokeStyle = 'rgba(255,255,255,0.28)';
        uiCtx.lineWidth = 2;
        roundedRect(uiCtx, x, y, w, h, 12);
        uiCtx.fill();
        uiCtx.stroke();

        uiCtx.fillStyle = color;
        roundedRect(uiCtx, x + 3, y + 3, Math.max(8, (w - 6) * ratio), h - 6, 8);
        uiCtx.fill();

        uiCtx.fillStyle = '#fff';
        uiCtx.font = 'bold 20px "Segoe UI", "PingFang SC", sans-serif';
        uiCtx.textAlign = 'center';
        uiCtx.fillText(label, x + w / 2, y + h - 10);
    }

    function drawFloatingTexts() {
        for (var i = 0; i < floatingTexts.length; i++) {
            var t = floatingTexts[i];
            uiCtx.save();
            uiCtx.globalAlpha = clamp(t.life / 24, 0, 1);
            uiCtx.fillStyle = t.color;
            uiCtx.font = 'bold 26px "Segoe UI", "PingFang SC", sans-serif';
            uiCtx.textAlign = 'center';
            uiCtx.shadowColor = 'rgba(0,0,0,0.65)';
            uiCtx.shadowBlur = 8;
            uiCtx.fillText(t.text, t.x, t.y);
            uiCtx.restore();
        }
    }

    function drawUI() {
        uiCtx.clearRect(0, 0, WIDTH, HEIGHT);

        var hpRatio = tank.hp / tank.maxHp;
        var hpColor = hpRatio > 0.5 ? '#4CAF50' : (hpRatio > 0.25 ? '#FF9800' : '#F44336');
        drawBar(40, 35, 380, 36, hpRatio, hpColor, 'HP  ' + tank.hp + ' / ' + tank.maxHp);

        var skillRatio;
        var skillColor;
        var skillText;
        if (tank.skillActive) {
            skillRatio = tank.skillTimer / tank.skillDuration;
            skillColor = '#FFD700';
            skillText = '主防开启';
        } else if (tank.skillCooldownTimer > 0) {
            skillRatio = tank.skillCooldownTimer / tank.skillCooldown;
            skillColor = '#777';
            skillText = '主防冷却 ' + Math.ceil(tank.skillCooldownTimer / 60) + 's';
        } else {
            skillRatio = 1;
            skillColor = '#4CAF50';
            skillText = '主防就绪 [Shift]';
        }
        drawBar(40, 84, 380, 24, skillRatio, skillColor, skillText);

        uiCtx.fillStyle = '#fff';
        uiCtx.textAlign = 'right';
        uiCtx.font = 'bold 54px "Segoe UI", "PingFang SC", sans-serif';
        uiCtx.shadowColor = 'rgba(255,255,255,0.36)';
        uiCtx.shadowBlur = 18;
        uiCtx.fillText(String(Math.floor(score)), WIDTH - 50, 82);
        uiCtx.shadowBlur = 0;
        uiCtx.font = '20px "Segoe UI", "PingFang SC", sans-serif';
        uiCtx.fillStyle = 'rgba(255,255,255,0.72)';
        uiCtx.fillText('BEST ' + bestScore, WIDTH - 50, 114);

        if (combo >= 2) {
            uiCtx.textAlign = 'left';
            uiCtx.fillStyle = '#FFD700';
            uiCtx.font = 'bold 28px "Segoe UI", "PingFang SC", sans-serif';
            uiCtx.fillText('连击 x' + combo, 42, 150);
        }

        drawFloatingTexts();

        if (paused) {
            uiCtx.fillStyle = 'rgba(0,0,0,0.68)';
            uiCtx.fillRect(0, HEIGHT / 2 - 125, WIDTH, 250);
            uiCtx.fillStyle = '#fff';
            uiCtx.font = 'bold 62px "Segoe UI", "PingFang SC", sans-serif';
            uiCtx.textAlign = 'center';
            uiCtx.fillText('暂停中', WIDTH / 2, HEIGHT / 2 - 15);
            uiCtx.font = '26px "Segoe UI", "PingFang SC", sans-serif';
            uiCtx.fillStyle = '#ddd';
            uiCtx.fillText('按 P / ESC 或点击右侧按钮继续', WIDTH / 2, HEIGHT / 2 + 55);
            return;
        }

        if (gameOver) {
            uiCtx.fillStyle = 'rgba(0,0,0,0.76)';
            uiCtx.fillRect(0, HEIGHT / 2 - 150, WIDTH, 300);
            uiCtx.fillStyle = '#fff';
            uiCtx.font = 'bold 64px "Segoe UI", "PingFang SC", sans-serif';
            uiCtx.textAlign = 'center';
            uiCtx.shadowColor = 'rgba(255,0,0,0.6)';
            uiCtx.shadowBlur = 30;
            uiCtx.fillText('坦克损毁', WIDTH / 2, HEIGHT / 2 - 55);
            uiCtx.shadowBlur = 0;
            uiCtx.fillStyle = '#ddd';
            uiCtx.font = '30px "Segoe UI", "PingFang SC", sans-serif';
            uiCtx.fillText('得分 ' + Math.floor(score) + '  /  最高 ' + bestScore + '  /  最大连击 x' + maxCombo, WIDTH / 2, HEIGHT / 2 + 16);
            uiCtx.font = '25px "Segoe UI", "PingFang SC", sans-serif';
            uiCtx.fillText('按空格 / 点击屏幕重新出发', WIDTH / 2, HEIGHT / 2 + 78);
        } else if (!gameStarted) {
            uiCtx.fillStyle = 'rgba(0,0,0,0.64)';
            uiCtx.fillRect(0, HEIGHT / 2 - 155, WIDTH, 310);
            uiCtx.fillStyle = '#fff';
            uiCtx.font = 'bold 54px "Segoe UI", "PingFang SC", sans-serif';
            uiCtx.textAlign = 'center';
            uiCtx.fillText('轻 坦 快 跑', WIDTH / 2, HEIGHT / 2 - 70);
            uiCtx.fillStyle = '#ddd';
            uiCtx.font = '25px "Segoe UI", "PingFang SC", sans-serif';
            uiCtx.fillText('按空格 / 点击屏幕开始', WIDTH / 2, HEIGHT / 2 - 12);
            uiCtx.fillStyle = '#aaa';
            uiCtx.font = '19px "Segoe UI", "PingFang SC", sans-serif';
            uiCtx.fillText('跳跃: 空格/↑/W  |  下蹲: ↓/S  |  主防: Shift  |  暂停: P/ESC', WIDTH / 2, HEIGHT / 2 + 35);
            uiCtx.fillStyle = '#FFD700';
            uiCtx.fillText('新增：极限闪避、连击、主防格挡、最高分记录', WIDTH / 2, HEIGHT / 2 + 76);
        }
    }

    function gameLoop() {
        update();
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        drawBackground();
        drawPickups();
        drawObstacles();
        drawTank();
        drawUI();
        requestAnimationFrame(gameLoop);
    }

    function startWhenReady() {
        if (loaded >= totalImages) {
            gameLoop();
        } else {
            setTimeout(startWhenReady, 120);
        }
    }
    startWhenReady();
})();
</script>
</body>
</html>
